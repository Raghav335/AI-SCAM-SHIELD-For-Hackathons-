<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Scam Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <div class="container">

    <div class="logo">
      🛡️
    </div>

    <h1>AI Scam Shield</h1>

    <p class="tagline">
      Detect. Protect. Stay Safe.
    </p>

    <div id="status" class="status inactive">

      <div id="statusIcon" class="status-icon">
        🔓
      </div>

      <div>
        <h2 id="statusText">
          Shield Inactive
        </h2>

        <small>
          Link protection is OFF
        </small>
      </div>

    </div>

    <button id="toggleButton" class="activate">
      Activate Shield
    </button>

    <div class="info">
      <span>🔗</span>
      <p>
        When the shield is active, suspicious links
        can be checked before you continue.
      </p>
    </div>

    <div class="footer">
      AI Scam Shield • Demo
    </div>

  </div>

  <script src="popup.js"></script>

</body>
</html>
